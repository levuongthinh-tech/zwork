{% extends "base.html" %}
{% block title %}Lỗi {{ code }}{% endblock %}
{% block content %}<div class="card" style="max-width:520px"><h1>{{ code }}</h1><p>{{ message }}</p><a class="btn" href="{{ url_for('main.dashboard') }}">Về trang tổng quan</a></div>{% endblock %}
{% block bare %}<div class="auth-wrap"><div class="auth-card"><h1>{{ code }}</h1><p>{{ message }}</p><a class="btn" href="{{ url_for('auth.login') }}">Đăng nhập</a></div></div>{% endblock %}
