<form method="post" class="{{ cls }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% if current_user.must_change_password %}<div class="brand"><span class="brand-mark">Z</span> ZHI.PAT Work</div>
  <p>Xin chào <b>{{ current_user.full_name }}</b>. Vui lòng đặt mật khẩu mới trước khi bắt đầu.</p>{% endif %}
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}<div class="flash flash-{{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <div class="field"><label>Mật khẩu hiện tại</label><input type="password" name="old_password" required autocomplete="current-password"></div>
  <div class="field"><label>Mật khẩu mới (tối thiểu 8 ký tự)</label><input type="password" name="new_password" minlength="8" required autocomplete="new-password"></div>
  <div class="field"><label>Nhập lại mật khẩu mới</label><input type="password" name="confirm_password" minlength="8" required autocomplete="new-password"></div>
  <button class="btn btn-primary">Đổi mật khẩu</button>
</form>
